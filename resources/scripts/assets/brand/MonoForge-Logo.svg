<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#232a38"/>
      <stop offset="0.6" stop-color="#141822"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f9"/>
      <stop offset="0.42" stop-color="#b9c3d2"/>
      <stop offset="1" stop-color="#5d6a80"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb02e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff4d12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffb42e"/>
      <stop offset="1" stop-color="#ff5a14"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ff5a14" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5a14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg)"/>
  </g>

  <g id="mark" transform="translate(512 540) scale(1.09) translate(-512 -475)">
    <circle cx="512" cy="270" r="270" fill="url(#glow)"/>

    <!-- anvil silhouette cut as an M: horn left, heel right, V notch on top, arch between the feet -->
    <path id="anvil" fill="url(#steel)" d="
      M 112 300
      L 398 300
      L 512 540
      L 626 300
      L 864 300
      L 864 382
      L 772 436
      L 772 640
      L 846 768
      L 628 768
      L 628 722
      L 512 628
      L 396 722
      L 396 768
      L 178 768
      L 252 640
      L 252 436
      C 205 400 150 350 112 300 Z"/>

    <!-- forge heat on the inner faces of the V -->
    <path fill="url(#heat)" d="M 398 300 L 512 540 L 626 300 L 604 300 L 512 494 L 420 300 Z"/>

    <!-- ember -->
    <path fill="url(#ember)" d="M 512 164 L 572 244 L 512 324 L 452 244 Z"/>

    <!-- sparks -->
    <g fill="#ffc24a">
      <rect x="622" y="172" width="30" height="30" transform="rotate(45 637 187)"/>
      <rect x="376" y="150" width="24" height="24" transform="rotate(45 388 162)"/>
    </g>
  </g>
</svg>
